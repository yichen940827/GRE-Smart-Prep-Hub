<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRE Master Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--pink:#FF48A4;--tint:#FFF0F7;--line:#E4E4E4;--mute:#666;--serif:'Noto Serif TC',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans TC',sans-serif}
body{background:#fff;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;line-height:1.7}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:1rem clamp(1rem,4vw,3rem);border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:100}
.logo{font-family:var(--serif);font-weight:900;font-size:1.3rem;display:flex;align-items:center;gap:10px}
.logo::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--pink)}
nav{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:.3rem 0;font-size:1rem;font-weight:500;cursor:pointer}
.tab:hover{border-color:var(--line)}.tab.active{border-color:var(--pink);font-weight:700}
.gear{background:none;border:1px solid var(--ink);border-radius:999px;padding:.35rem 1rem;font-size:.9rem;font-weight:500;cursor:pointer}
.gear:hover{background:var(--ink);color:#fff}
.container{max-width:1240px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem) 4rem;width:100%;flex-grow:1}
.pane{display:none}.pane.active{display:block}
.hero{padding:clamp(2.5rem,7vw,5rem) 0 clamp(1.8rem,4vw,3rem)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.3rem,6vw,4.6rem);line-height:1.15}
.hero p{margin-top:1rem;color:var(--mute);max-width:34rem;font-size:1.05rem}
.card{padding-top:clamp(2rem,5vw,3.5rem)}
.card-h{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:1.6rem}
.card-h span{font-family:var(--serif);font-weight:900;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.2}
.card-h i{display:none}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:700;margin:1.1rem 0 .4rem;font-size:.95rem}
select,input[type=text],input[type=password],textarea{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff}
select:focus,input:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:150px;resize:vertical}
.drop{border:1px dashed #999;border-radius:10px;padding:.8rem;text-align:center;color:var(--mute);cursor:pointer;font-size:.95rem}
.drop:hover{border-color:var(--pink)}
#prevWrap{display:none;margin-top:.6rem}#prev{max-width:100%;max-height:200px;border-radius:10px;border:1px solid var(--line)}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:.7rem 1.5rem;border-radius:999px;font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.btn:hover{background:var(--pink);border-color:var(--pink);color:#000}.btn:disabled{opacity:.5;cursor:wait}
.btn.gold{background:var(--pink);border-color:var(--pink);color:#000}.btn.gold:hover{background:#000;border-color:#000;color:#fff}
.btn.line{background:none;color:var(--ink)}.btn.line:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:.25rem .8rem;font-size:.85rem}
.hint{font-size:.85rem;color:#B42318;margin-top:.3rem}
.warn{background:#FFF8D6;border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem}
.err{background:#FEE4E2;color:#B42318;border-radius:10px;padding:.8rem 1rem}
.out{border:1px solid var(--line);border-radius:20px;padding:1.4rem 1.6rem;min-height:420px}
.empty{color:var(--mute);text-align:center;padding:5rem 1rem}
.ztabs{display:flex;align-items:center;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.zt{background:none;border:none;border-bottom:3px solid transparent;padding:.5rem 0;margin-bottom:-1px;font-size:1.05rem;font-weight:700;color:var(--mute);cursor:pointer}
.zt.active{color:#000;border-color:var(--pink)}
.cnt{background:var(--pink);color:#000;border-radius:999px;font-size:.75rem;padding:0 .5rem;margin-left:.4rem}
.ztabs .btn{margin-left:auto;margin-bottom:.4rem}
.zone{display:none}.zone.active{display:block}
.ans{background:var(--tint);border-radius:18px;padding:1.1rem 1.4rem}
.ans span{font-size:.9rem;font-weight:700;color:#C21F73}
.av{font-family:var(--serif);font-weight:900;font-size:1.9rem;line-height:1.35;margin-top:.15rem}
.part{padding:1.4rem 0;border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:.8rem;margin-bottom:.7rem;flex-wrap:wrap}
.ph b{font-family:var(--serif);font-size:1.15rem;font-weight:900}
.pa{background:#000;color:#fff;border-radius:999px;padding:.1rem .9rem;font-weight:700}
.part dl{display:grid;grid-template-columns:7.5rem 1fr;gap:.55rem 1rem}
.part dt{font-weight:700;color:var(--mute);font-size:.9rem;padding-top:.15rem}
@media(max-width:600px){.part dl{grid-template-columns:1fr;gap:.1rem}.part dd{margin-bottom:.6rem}}
dd b,.tr b{background:var(--tint);box-shadow:inset 0 -2px var(--pink)}
.diag{margin-top:1.2rem;border-left:3px solid var(--pink);padding:.3rem 0 .3rem 1rem}
.fold{margin-top:1.2rem}.fold summary{cursor:pointer;font-weight:700}.foldb{margin-top:.6rem;color:var(--mute);font-size:.95rem}
.xs{margin-bottom:2.2rem}.xs h3{font-family:var(--serif);font-weight:900;font-size:1.3rem;margin-bottom:.8rem}
.tr{line-height:2;white-space:pre-wrap}
.tw{overflow-x:auto}
.vt{width:100%;border-collapse:collapse;font-size:.95rem;min-width:600px}
.vt th{text-align:left;font-size:.85rem;color:var(--mute);font-weight:500;padding:.5rem .6rem;border-bottom:2px solid #000}
.vt td{padding:.7rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
.vw{font-family:var(--serif);font-size:1.1rem;font-weight:700}
.vsub{font-size:.85rem;color:var(--mute)}
.tag{font-size:.75rem;background:#EEE;color:#333;border-radius:10px;padding:1px 8px;margin-left:4px}
.tag.in{background:var(--tint);color:#C21F73}
.filters{display:flex;gap:8px;margin-bottom:1.4rem;flex-wrap:wrap}
.chipbtn{padding:.4rem 1.1rem;border-radius:999px;border:1px solid var(--ink);background:none;cursor:pointer;font-weight:500}
.chipbtn.active{background:#000;color:#fff}
.mc{border-top:1px solid var(--ink);padding:1.4rem 0}
.mc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.st{cursor:pointer;border:none;padding:.25rem .9rem;border-radius:999px;font-weight:700}
.st.REVIEW{background:var(--tint);color:#C21F73}.st.MASTERED{background:#000;color:#fff}
.zh{font-family:var(--serif);font-weight:900;font-size:1.2rem;margin:1.4rem 0 .6rem}
details summary{cursor:pointer;font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem;margin-top:1.2rem}
.flip{height:190px;perspective:900px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:1rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--ink)}
.fr{background:#fff}.bk{background:#000;color:#fff;transform:rotateY(180deg);font-size:.9rem;gap:6px}
.w{font-family:var(--serif);font-size:1.7rem;font-weight:900}
.d{color:var(--pink);font-weight:700;font-size:1.1rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:1000}
.modal>div{background:#fff;padding:1.8rem;border-radius:20px;max-width:480px;width:90%}
footer{background:#000;color:#fff;padding:1.4rem clamp(1rem,4vw,3rem);font-size:.85rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">GRE Master Pro</div>
  <nav>
    <button class="tab active" data-tab="solver">解題</button>
    <button class="tab" data-tab="notebook">錯題本</button>
    <button class="tab" data-tab="vocab">單字書</button>
    <button class="gear" id="gear" title="設定 API Key">API Key</button>
  </nav>
</header>

<div class="container">
  <section id="solver" class="pane active">
    <div class="hero"><h1>把不會的題目<br>丟進來就好。</h1><p>貼上文字或截圖，取得中文解析、整題翻譯與單字整理。</p></div>
    <div class="grid">
      <div>
        <label for="model">AI 模型</label>
        <select id="model"></select><div class="hint" id="hint"></div>
        <label for="qType">題型</label>
        <select id="qType">
          <option value="TC">填空 (Text Completion / Sentence Equivalence)</option>
          <option value="RC">閱讀 (Reading Comprehension)</option>
          <option value="Quant">數學 (Quantitative Reasoning)</option>
        </select>
        <label for="q">題目（文字或截圖擇一即可）</label>
        <textarea id="q" placeholder="貼上題目全文；閱讀題請連文章一起貼"></textarea>
        <div class="drop" id="drop"><i class="fa-regular fa-image"></i> 點擊上傳截圖，或直接 Ctrl/⌘+V 貼上</div>
        <input type="file" id="file" accept="image/*" hidden>
        <div id="prevWrap"><img id="prev" alt="題目截圖"> <button class="btn line sm" id="rmImg">移除</button></div>
        <label for="opts">選項（選填）</label>
        <input type="text" id="opts" placeholder="A) ubiquitous  B) ephemeral  C) equivocal ...">
        <label for="mine">我的答案（選填，AI 會診斷你為什麼錯）</label>
        <input type="text" id="mine" placeholder="例如：B，因為我覺得空格是負面語氣">
        <div style="margin-top:1.1rem"><button class="btn gold" id="go"><i class="fa-solid fa-bolt"></i> 開始解析</button></div>
      </div>
      <div id="result" class="out"><p class="empty">解題區與補充區會顯示在這裡</p></div>
    </div>
  </section>

  <section id="notebook" class="pane"><div class="card">
    <div class="card-h"><span><i class="fa-solid fa-book-open-reader"></i> 我的錯題本</span><button class="btn purple" id="exp"><i class="fa-solid fa-download"></i> 備份</button></div>
    <div class="filters" id="filters">
      <button class="chipbtn active" data-f="ALL">全部</button><button class="chipbtn" data-f="TC">填空</button><button class="chipbtn" data-f="RC">閱讀</button><button class="chipbtn" data-f="Quant">數學</button>
    </div>
    <div id="mlist"></div>
  </div></section>

  <section id="vocab" class="pane"><div class="card">
    <div class="card-h"><span><i class="fa-solid fa-layer-group"></i> 單字書（Mason 字庫 + 我加入的字）</span><button class="btn line" id="cover"><i class="fa-solid fa-eye-slash"></i> 翻面測驗</button></div>
    <div id="dbwarn"></div>
    <input type="text" id="vs" placeholder="搜尋單字、中文或字根">
    <div class="vgrid" id="vgrid"></div>
  </div></section>
</div>

<div class="modal" id="modal"><div>
  <h3 style="color:var(--navy);margin-bottom:.7rem"><i class="fa-solid fa-key"></i> <span id="mTitle">API Key</span></h3>
  <p style="font-size:.9rem;color:var(--mute);margin-bottom:.8rem">Key 只存在你的瀏覽器，並直接送往 Google。請勿在公用電腦使用。</p>
  <input type="password" id="keyIn" placeholder="貼上 API Key">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:1rem"><button class="btn line" id="keyCancel">取消</button><button class="btn gold" id="keySave">儲存</button></div>
</div></div>
<footer><span>GRE Master Pro</span><span>解析由 AI 產生，答案請自行核對</span></footer>

<script>
/* ===== 設定 ===== */
const CONFIG = {
  PROXY_URL: '', // 部署 worker.js 後填入；留空則使用者自備各家 Key
  PROXY_PROVIDERS: ['gemini', 'claude'], // 有 PROXY_URL 時，只顯示 Worker 已設定 Secret 的供應商
  DB_URL: './assets/GRE_Mason_Full_Database_2.json'
};
const PROVIDERS = {
  gemini: { name: 'Google Gemini', help: '到 aistudio.google.com 申請' },
  claude: { name: 'Anthropic Claude', help: '到 console.anthropic.com 申請' }
};
// 模型 ID 會更新，請以各家官方清單為準；tier: top=推理強、low=數學較容易算錯
const MODELS = [
  { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash（快、便宜）', provider: 'gemini', vision: true, tier: 'mid' },
  { id: 'gemini-2.5-pro', label: 'Gemini 2.5 Pro（較準）', provider: 'gemini', vision: true, tier: 'top' },
  { id: 'claude-sonnet-5-5', label: 'Claude Sonnet 5.5', provider: 'claude', vision: true, tier: 'top' },
  { id: 'claude-opus-5-5', label: 'Claude Opus 5.5（最準、最貴）', provider: 'claude', vision: true, tier: 'top' }
];
const SYSTEM = `你是資深 GRE 名師，學生是台灣考生。學生會貼上一道 GRE 題目（可能是文字或截圖）。請全程使用繁體中文（台灣慣用語）撰寫解析，英文原文、單字與片語保留英文。
推導規則：
- 先在 scratch_work 完整推導（可以很長，不會直接顯示）：Quant 要列出計算並驗算；填空先找線索詞與語意方向，再逐一檢查選項。
- 若題目資訊不完整（閱讀文章被截斷、截圖看不清），在 warnings 說明，不要亂猜。
- Sentence Equivalence 必須給兩個答案，並說明兩者為何同義。
輸出規則：
- answer：最終答案。多空格請寫成「空格 1：X；空格 2：Y」。
- parts：每個空格（或每個小題、每個解題步驟）一筆，包含：
  - label：「空格 1」「第 2 題」「步驟 1」之類。
  - answer：該項答案。
  - clue：線索詞與轉折詞（例如 although、however、not only…but also），保留英文原文，並說明語意方向（正向、反向、因果、對比、遞進）。Quant 則寫考點。
  - structure：句構分析（主要子句、從屬子句、修飾關係、空格的位置與所需詞性），2 到 3 句。Quant 則寫解法或公式。
  - reasoning：為什麼選這個答案，並簡短說明主要干擾選項為何不對，100 字內。Quant 則寫計算與驗算。
  - 引用原文關鍵片語時用 **粗體** 標示。
- translation：整題（題目加選項）完整的繁體中文翻譯，通順自然。
- vocab：題目與選項中值得學的單字與片語（最多 10 筆）。word 用原形；pos 寫詞性（adj.、n.、v.、adv.，片語寫「片語」）；meaning_zh 簡潔；synonyms 提供 2 到 4 個 GRE 常見同義字。
- diagnosis：若學生提供了「我的答案」，用 2 到 3 句指出他錯在哪個思考環節；沒有則留空字串。
- 不要使用 markdown 標題、表格或條列符號。`;
const SCHEMA = {
  type: 'object',
  properties: {
    scratch_work: { type: 'string', description: '完整推導與計算草稿' },
    answer: { type: 'string' },
    parts: { type: 'array', items: { type: 'object', properties: { label: { type: 'string' }, answer: { type: 'string' }, clue: { type: 'string' }, structure: { type: 'string' }, reasoning: { type: 'string' } }, required: ['label', 'answer', 'clue', 'structure', 'reasoning'] } },
    translation: { type: 'string', description: '整題完整繁體中文翻譯' },
    vocab: { type: 'array', items: { type: 'object', properties: { word: { type: 'string' }, pos: { type: 'string' }, meaning_zh: { type: 'string' }, synonyms: { type: 'array', items: { type: 'string' } } }, required: ['word', 'pos', 'meaning_zh'] } },
    diagnosis: { type: 'string' },
    warnings: { type: 'string' }
  },
  required: ['scratch_work', 'answer', 'parts', 'translation', 'vocab']
};

/* ===== 工具 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { alert('瀏覽器儲存空間已滿或被停用'); } };
let mistakes = load('GRE_MISTAKES_V2', []), myVocab = load('GRE_MYVOCAB', []), mason = [], dbMap = new Map(), lastAi = null, lastMeta = null, imgData = null, filter = 'ALL';

/* ===== 分頁 / 設定 ===== */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab,.pane').forEach(e => e.classList.remove('active'));
  b.classList.add('active'); $(b.dataset.tab).classList.add('active');
});
const openModal = () => {
  const p = curModel().provider;
  $('mTitle').textContent = PROVIDERS[p].name + ' API Key（' + PROVIDERS[p].help + '）';
  $('keyIn').value = localStorage.getItem(keyName(p)) || ''; $('modal').style.display = 'flex';
};
$('gear').onclick = openModal;
$('keyCancel').onclick = () => $('modal').style.display = 'none';
$('keySave').onclick = () => { const k = $('keyIn').value.trim(); if (!k) return; localStorage.setItem(keyName(curModel().provider), k); $('modal').style.display = 'none'; };
if (CONFIG.PROXY_URL) $('gear').style.display = 'none';

/* ===== 圖片 ===== */
function loadImg(f) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', .85);
      imgData = url.split(',')[1]; $('prev').src = url; $('prevWrap').style.display = 'block'; updateHint();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && loadImg(e.target.files[0]);
$('rmImg').onclick = () => { imgData = null; $('prevWrap').style.display = 'none'; $('file').value = ''; updateHint(); };
document.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/')); if (f) loadImg(f); });

/* ===== 多模型呼叫 ===== */
const toGemini = s => Array.isArray(s) ? s.map(toGemini) : (s && typeof s === 'object')
  ? Object.fromEntries(Object.entries(s).filter(([k]) => k !== 'description').map(([k, v]) => [k, k === 'type' ? String(v).toUpperCase() : toGemini(v)])) : s;
const curModel = () => MODELS.find(m => m.id === $('model').value) || MODELS[0];
const keyName = p => 'GRE_KEY_' + p;

const ADAPTERS = {
  gemini: {
    url: m => `https://generativelanguage.googleapis.com/v1beta/models/${m.id}:generateContent`,
    headers: k => ({ 'x-goog-api-key': k }),
    body: (m, qType, text) => ({
      systemInstruction: { parts: [{ text: SYSTEM }] },
      contents: [{ role: 'user', parts: [...(imgData ? [{ inlineData: { mimeType: 'image/jpeg', data: imgData } }] : []), { text }] }],
      generationConfig: { temperature: 0.2, maxOutputTokens: qType === 'Quant' ? 16000 : 8192, responseMimeType: 'application/json', responseSchema: toGemini(SCHEMA) }
    }),
    parse: data => {
      if (data.promptFeedback?.blockReason) throw new Error('題目被安全過濾擋下：' + data.promptFeedback.blockReason);
      const c = data.candidates?.[0];
      if (c?.finishReason === 'MAX_TOKENS') throw new Error('回答被截斷（題目太長或太複雜），請縮短後重試');
      return (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
  },
  claude: {
    url: () => 'https://api.anthropic.com/v1/messages',
    headers: k => ({ 'x-api-key': k, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }),
    body: (m, qType, text) => ({
      model: m.id, max_tokens: qType === 'Quant' ? 6000 : 4096, temperature: 0.2, system: SYSTEM,
      tools: [{ name: 'submit_analysis', description: '提交 GRE 題目解析', input_schema: SCHEMA }],
      tool_choice: { type: 'tool', name: 'submit_analysis' },
      messages: [{ role: 'user', content: [...(imgData ? [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: imgData } }] : []), { type: 'text', text }] }]
    }),
    parse: data => {
      if (data.stop_reason === 'max_tokens') throw new Error('回答被截斷（題目太長或太複雜），請縮短後重試');
      return (data.content || []).find(b => b.type === 'tool_use')?.input;
    }
  }
};

function normalize(a) {
  const s = v => Array.isArray(v) ? v.map(s).join(', ') : v == null ? '' : typeof v === 'string' ? v : JSON.stringify(v);
  const arr = v => Array.isArray(v) ? v : [];
  return {
    scratch_work: s(a.scratch_work), translation: s(a.translation), answer: s(a.answer), diagnosis: s(a.diagnosis), warnings: s(a.warnings),
    parts: arr(a.parts).map(p => ({ label: s(p?.label), answer: s(p?.answer), clue: s(p?.clue), structure: s(p?.structure), reasoning: s(p?.reasoning) })),
    vocab: arr(a.vocab).filter(v => v?.word).map(v => ({ word: s(v.word), pos: s(v.pos), meaning_zh: s(v.meaning_zh), synonyms: arr(v.synonyms).map(s) }))
  };
}

async function callAI(m, qType, text) {
  const A = ADAPTERS[m.provider], body = A.body(m, qType, text);
  let url, headers = { 'content-type': 'application/json' };
  if (CONFIG.PROXY_URL) { url = CONFIG.PROXY_URL; body.provider = m.provider; body.model = m.id; }
  else {
    const key = localStorage.getItem(keyName(m.provider));
    if (!key) { openModal(); throw new Error(`請先設定 ${PROVIDERS[m.provider].name} 的 API Key`); }
    url = A.url(m); Object.assign(headers, A.headers(key));
  }
  const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || (typeof data.error === 'string' ? data.error : `API 錯誤 (${r.status})`));
  let out = A.parse(data);
  if (typeof out === 'string') {
    out = out.replace(/^```(?:json)?\s*|\s*```$/g, '').trim();
    try { out = JSON.parse(out); } catch { throw new Error('模型回傳格式錯誤，請重試或換一個模型'); }
  }
  if (!out || typeof out !== 'object') throw new Error('模型沒有回傳內容，請重試');
  out = normalize(out); out.qType = qType;
  if (!out.answer) throw new Error('模型沒有給出答案，請重試或換一個更強的模型');
  return out;
}

/* ===== 模型選單 / 提示 ===== */
function updateHint() {
  const m = curModel(), msgs = [];
  if ($('qType').value === 'Quant' && m.tier === 'low') msgs.push('數學題建議改選 Pro / Opus 等級模型。');
  if (imgData && !m.vision) msgs.push('這個模型無法讀圖，請改選可看圖的模型。');
  $('hint').textContent = msgs.join(' ');
}
(function initModels() {
  const list = MODELS.filter(m => !CONFIG.PROXY_URL || CONFIG.PROXY_PROVIDERS.includes(m.provider));
  $('model').innerHTML = PROVIDERS ? Object.keys(PROVIDERS).map(p => {
    const ms = list.filter(m => m.provider === p);
    return ms.length ? `<optgroup label="${esc(PROVIDERS[p].name)}">${ms.map(m => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('')}</optgroup>` : '';
  }).join('') : '';
  const saved = localStorage.getItem('GRE_MODEL');
  if (saved && list.some(m => m.id === saved)) $('model').value = saved;
  $('model').onchange = () => { localStorage.setItem('GRE_MODEL', $('model').value); updateHint(); };
  $('qType').onchange = updateHint;
  updateHint();
})();

$('go').onclick = async () => {
  const qType = $('qType').value, q = $('q').value.trim(), opts = $('opts').value.trim(), mine = $('mine').value.trim();
  if (!q && !imgData) return alert('請輸入題目或上傳截圖');
  const text = `題型：${qType}\n題目：${q || '(見截圖)'}\n選項：${opts || '無／見截圖'}\n我的答案：${mine || '未提供'}`;
  $('go').disabled = true;
  $('result').innerHTML = `<p style="text-align:center;margin-top:100px;color:var(--navy)"><i class="fa-solid fa-spinner fa-spin"></i> ${qType === 'Quant' ? '正在推導並驗算，約需 30–60 秒…' : '解析中…'}</p>`;
  try {
    const m = curModel();
    if (imgData && !m.vision) throw new Error('這個模型無法讀取圖片，請改選可看圖的模型，或改貼文字題目');
    lastAi = await callAI(m, qType, text);
    lastMeta = { type: qType, question: q || '(截圖題目)', mine };
    showResult(lastAi);
  } catch (e) {
    $('result').innerHTML = `<div class="err"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(e.message)}</div>`;
  } finally { $('go').disabled = false; }
};

/* ===== 渲染解析 ===== */
function vocabRow(v) {
  const m = dbMap.get(String(v.word).toLowerCase());
  const payload = encodeURIComponent(JSON.stringify({ word: v.word, def: v.meaning_zh, synonyms: v.synonyms || [] })).replace(/'/g, '%27');
  const mine = myVocab.some(x => x.word.toLowerCase() === String(v.word).toLowerCase());
  const syn = [...new Set([...(m?.synonyms || []), ...(v.synonyms || [])])].join(', ');
  return `<tr><td><b class="vw">${esc(v.word)}</b><span class="tag ${m ? 'in' : ''}">${m ? 'Mason' : '庫外'}</span>${m?.root ? `<div class="vsub">字根 ${esc(m.root)}</div>` : ''}</td>
    <td>${esc(v.pos || '')}</td><td>${esc(v.meaning_zh || m?.def || '')}</td><td>${esc(syn)}</td>
    <td>${m || mine ? '' : `<button class="btn sm line" onclick="addVocab('${payload}',this)">加入</button>`}</td></tr>`;
}
function renderSolve(a) {
  const L = a.qType === 'Quant' ? ['考點', '解法', '計算與驗算'] : ['線索詞／轉折詞', '句構分析', '解析'];
  const parts = a.parts || [];
  const old = !parts.length && (a.steps?.length || a.explanation) ? `<p style="margin-top:1rem">${(a.steps?.length ? a.steps : [a.explanation]).map(rich).join('<br>')}</p>` : '';
  const row = (t, x) => x ? `<dt>${t}</dt><dd>${rich(x)}</dd>` : '';
  return `${a.warnings ? `<div class="warn">${rich(a.warnings)}</div>` : ''}
  <div class="ans"><span>答案</span><div class="av">${esc(a.answer)}</div></div>
  ${parts.map(p => `<article class="part"><div class="ph"><b>${esc(p.label)}</b>${p.answer ? `<span class="pa">${esc(p.answer)}</span>` : ''}</div>
    <dl>${row(L[0], p.clue)}${row(L[1], p.structure)}${row(L[2], p.reasoning)}</dl></article>`).join('')}${old}
  ${a.diagnosis ? `<div class="diag"><b>你的盲點</b><p>${rich(a.diagnosis)}</p></div>` : ''}
  ${a.scratch_work ? `<details class="fold"><summary>AI 完整推導過程</summary><div class="foldb">${rich(a.scratch_work)}</div></details>` : ''}`;
}
function renderExtra(a) {
  const rows = (a.vocab || []).map(vocabRow).join('');
  return `<section class="xs"><h3>整題中文翻譯</h3><p class="tr">${rich(a.translation)}</p></section>
  <section class="xs"><h3>單字與片語整理</h3>${rows ? `<div class="tw"><table class="vt"><thead><tr><th>單字／片語</th><th>詞性</th><th>中文意思</th><th>同義字</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="vsub">這題沒有需要整理的單字。</p>'}</section>`;
}
const renderAnalysis = a => `<h3 class="zh">解題區</h3>${renderSolve(a)}<h3 class="zh">補充區</h3>${renderExtra(a)}`;
function showResult(a) {
  $('result').innerHTML = `<div class="ztabs"><button class="zt active" data-z="zSolve">解題區</button><button class="zt" data-z="zExtra">補充區<span class="cnt">${(a.vocab || []).length}</span></button>
    <button class="btn line sm" onclick="addMistake(this)">加入錯題本</button></div>
    <div id="zSolve" class="zone active">${renderSolve(a)}</div><div id="zExtra" class="zone">${renderExtra(a)}</div>`;
}
$('result').addEventListener('click', e => {
  const b = e.target.closest('.zt'); if (!b) return;
  $('result').querySelectorAll('.zt').forEach(x => x.classList.toggle('active', x === b));
  $('result').querySelectorAll('.zone').forEach(z => z.classList.toggle('active', z.id === b.dataset.z));
});
function addMistake(btn) {
  mistakes.unshift({ id: Date.now(), ...lastMeta, ai: lastAi, notes: '', status: 'REVIEW' });
  save('GRE_MISTAKES_V2', mistakes); renderMistakes();
  btn.disabled = true; btn.textContent = '已加入';
}
function addVocab(p, btn) {
  const v = JSON.parse(decodeURIComponent(p));
  if (!myVocab.some(x => x.word.toLowerCase() === v.word.toLowerCase())) { myVocab.unshift(v); save('GRE_MYVOCAB', myVocab); renderVocab(); }
  btn.remove();
}

/* ===== 錯題本 ===== */
function renderMistakes() {
  const list = mistakes.filter(m => filter === 'ALL' || m.type === filter);
  $('mlist').innerHTML = list.length ? list.map(m => `
    <div class="mc ${esc(m.type)}">
      <div class="top"><b>${esc(m.type)}</b><button class="st ${m.status}" onclick="toggleSt(${m.id})">${m.status === 'MASTERED' ? '已掌握' : '需再複習'}</button></div>
      <div style="font-weight:700;color:var(--navy);white-space:pre-wrap">${esc(m.question.slice(0, 300))}${m.question.length > 300 ? '…' : ''}</div>
      <div style="margin:.4rem 0"><b>答案：</b>${esc(m.ai.answer)}${m.mine ? `　<span style="color:var(--mute)">我的答案：${esc(m.mine)}</span>` : ''}</div>
      <details><summary>查看完整解析</summary>${renderAnalysis(m.ai, false)}</details>
      <label>個人筆記</label><input type="text" value="${esc(m.notes)}" onchange="setNote(${m.id},this.value)" placeholder="自己的備註">
      <div style="text-align:right;margin-top:.5rem"><button class="btn line sm" onclick="delMistake(${m.id})">刪除</button></div>
    </div>`).join('') : '<p style="text-align:center;color:var(--mute);padding:2rem">還沒有錯題。解題後按「加入錯題本」。</p>';
}
const toggleSt = id => { const m = mistakes.find(x => x.id === id); m.status = m.status === 'MASTERED' ? 'REVIEW' : 'MASTERED'; save('GRE_MISTAKES_V2', mistakes); renderMistakes(); };
const setNote = (id, v) => { mistakes.find(x => x.id === id).notes = v; save('GRE_MISTAKES_V2', mistakes); };
const delMistake = id => { if (confirm('確定刪除這題？')) { mistakes = mistakes.filter(x => x.id !== id); save('GRE_MISTAKES_V2', mistakes); renderMistakes(); } };
$('filters').onclick = e => { const b = e.target.closest('.chipbtn'); if (!b) return; document.querySelectorAll('.chipbtn').forEach(x => x.classList.remove('active')); b.classList.add('active'); filter = b.dataset.f; renderMistakes(); };
$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ mistakes, myVocab }, null, 2)], { type: 'application/json' }));
  a.download = 'GRE_backup.json'; a.click();
};

/* ===== 單字書 ===== */
let covered = false;
function renderVocab() {
  const qs = $('vs').value.toLowerCase().trim();
  const all = [...myVocab.map(v => ({ ...v, mine: true })), ...mason];
  const list = all.filter(v => !qs || v.word.toLowerCase().includes(qs) || (v.def || '').includes(qs) || (v.root || '').toLowerCase().includes(qs)).slice(0, 300);
  $('vgrid').innerHTML = list.map(v => `<div class="flip ${covered ? 'on' : ''}" onclick="this.classList.toggle('on')"><div class="fi">
    <div class="fr"><div class="w">${esc(v.word)}</div><div style="color:var(--mute);font-size:.9rem">${esc(v.phonetic || (v.mine ? '我加入的' : ''))}</div></div>
    <div class="bk"><div class="d">${esc(v.def)}</div>${v.root ? `<div>字根：${esc(v.root)}</div>` : ''}<div>同義詞：${esc((v.synonyms || []).join(', ') || '—')}</div></div></div></div>`).join('')
    || '<p style="color:var(--mute)">找不到符合的單字</p>';
}
$('vs').oninput = renderVocab;
$('cover').onclick = () => { covered = !covered; renderVocab(); };

/* ===== 初始化 ===== */
(async () => {
  try {
    const r = await fetch(CONFIG.DB_URL);
    if (!r.ok) throw 0;
    mason = await r.json();
  } catch {
    $('dbwarn').innerHTML = '<div class="warn">找不到 Mason 單字庫（assets/GRE_Mason_Full_Database_2.json）。請確認檔案已上傳，且不要用雙擊 file:// 開啟，要透過 GitHub Pages 或 localhost。</div>';
  }
  dbMap = new Map(mason.map(w => [String(w.word).toLowerCase(), w]));
  renderVocab(); renderMistakes();
})();
</script>
</body>
