<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRE Master Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1B3A;--pink:#FF4F9A;--pink-soft:#FFE3EF;--yellow:#FFD21F;--yellow-soft:#FFF4B8;--line:#E7E5F0;--mute:#6B6880;--display:'Bricolage Grotesque','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans TC',sans-serif}
body{background:#fff;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;line-height:1.7}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:.9rem clamp(1rem,4vw,3rem);border-bottom:2px solid var(--ink);background:#fff;position:sticky;top:0;z-index:100}
.logo{font-family:var(--display);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.logo b{font-family:var(--display);background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:0 .55rem;transform:rotate(-4deg);display:inline-block}
nav{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.tab{background:none;border:2px solid transparent;border-radius:999px;padding:.35rem 1rem;font-size:.95rem;font-weight:700;cursor:pointer}
.tab:hover{background:var(--yellow-soft)}.tab.active{background:var(--pink);border-color:var(--ink)}
.gear{margin-left:.6rem;background:none;border:2px solid var(--ink);border-radius:999px;padding:.35rem 1rem;font-size:.9rem;font-weight:700;cursor:pointer}
.gear:hover{background:var(--yellow)}
.container{max-width:1240px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem) 4rem;width:100%;flex-grow:1}
.pane{display:none}.pane.active{display:block}
.hero{background:var(--yellow);border:2px solid var(--ink);border-radius:28px;padding:clamp(1.6rem,4vw,2.8rem);margin:clamp(1.2rem,3vw,2rem) 0 clamp(1.4rem,3vw,2.2rem)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.6vw,3.4rem);line-height:1.12;max-width:20ch}
.hero p{margin-top:.8rem;max-width:40rem;font-size:1.05rem}
.card{padding-top:clamp(1.4rem,4vw,2.4rem)}
.card-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:1.4rem}
.card-h span{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.2}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:700;margin:1.1rem 0 .4rem;font-size:.95rem}
.sub{font-weight:400;color:var(--mute);font-size:.85rem;margin-left:.4rem}
select,input[type=text],input[type=password],textarea{width:100%;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:12px;font-size:1rem;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:none;box-shadow:0 0 0 4px var(--pink-soft)}
textarea{min-height:150px;resize:vertical}
.drop{border:2px dashed var(--ink);border-radius:12px;padding:.8rem;text-align:center;color:var(--mute);cursor:pointer;font-size:.95rem;margin-top:.6rem}
.drop:hover{background:var(--yellow-soft)}
#prevWrap{display:none;margin-top:.6rem}#prev{max-width:100%;max-height:200px;border-radius:10px;border:2px solid var(--ink)}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);padding:.65rem 1.4rem;border-radius:999px;font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--pink)}
.btn:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
.btn.gold{background:var(--pink);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}.btn.gold:hover{box-shadow:5px 5px 0 var(--ink)}
.btn.line{background:#fff;color:var(--ink)}.btn.line:hover{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.btn.sm{padding:.2rem .8rem;font-size:.85rem}
.hint{font-size:.85rem;color:#B42318;margin-top:.3rem}
.warn{background:var(--yellow-soft);border:2px solid var(--ink);border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem}
.warn code{background:#fff;padding:0 .3rem;border-radius:4px;font-family:monospace}
.err{background:var(--pink-soft);border:2px solid var(--ink);border-radius:12px;padding:.8rem 1rem}
.out{border:2px solid var(--ink);border-radius:24px;padding:1.4rem 1.6rem;min-height:420px;box-shadow:8px 8px 0 var(--pink)}
.empty{color:var(--mute);text-align:center;padding:5rem 1rem}
.ztabs{display:flex;align-items:center;gap:.5rem;margin-bottom:1.3rem;flex-wrap:wrap}
.zt{background:none;border:2px solid var(--ink);border-radius:999px;padding:.3rem 1rem;font-size:.95rem;font-weight:700;cursor:pointer}
.zt.active{background:var(--yellow)}
.cnt{background:var(--pink);border:2px solid var(--ink);border-radius:999px;font-size:.72rem;padding:0 .45rem;margin-left:.4rem}
.ztabs .btn{margin-left:auto}
.zone{display:none}.zone.active{display:block}
.ans{background:var(--yellow);border:2px solid var(--ink);border-radius:18px;padding:1rem 1.3rem;box-shadow:4px 4px 0 var(--pink)}
.ans span{font-size:.85rem;font-weight:700}
.av{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.3}
.part{padding:1.3rem 0;border-bottom:2px dashed var(--line)}
.ph{display:flex;align-items:center;gap:.8rem;margin-bottom:.7rem;flex-wrap:wrap}
.ph b{font-family:var(--display);font-size:1.15rem;font-weight:800}
.pa{background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;font-weight:700}
.part dl{display:grid;grid-template-columns:8.5rem 1fr;gap:.55rem 1rem}
.part dt{font-weight:700;color:var(--mute);font-size:.88rem;padding-top:.15rem}
@media(max-width:600px){.part dl{grid-template-columns:1fr;gap:.1rem}.part dd{margin-bottom:.6rem}}
dd b,.tr b{background:linear-gradient(transparent 55%,var(--yellow) 55%);font-weight:700}
.diag{margin-top:1.2rem;background:var(--pink-soft);border-radius:14px;padding:.9rem 1.1rem}
.fold{margin-top:1.2rem}.fold summary{cursor:pointer;font-weight:700}.foldb{margin-top:.6rem;color:var(--mute);font-size:.95rem}
.xs{margin-bottom:2.2rem}.xs h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin-bottom:.8rem}
.tr{line-height:2;white-space:pre-wrap}
.tw{overflow-x:auto}
.vt{width:100%;border-collapse:collapse;font-size:.95rem;min-width:600px}
.vt th{background:var(--yellow-soft);text-align:left;font-size:.85rem;font-weight:700;padding:.55rem .7rem;border-bottom:2px solid var(--ink)}
.vt td{padding:.7rem;border-bottom:1px solid var(--line);vertical-align:top}
.vw{font-family:var(--display);font-size:1.1rem;font-weight:800}
.vsub{font-size:.85rem;color:var(--mute)}
.tag{font-size:.72rem;background:var(--yellow-soft);border:1px solid var(--ink);border-radius:10px;padding:0 7px;margin-left:5px}
.tag.in{background:var(--pink-soft)}
.filters{display:flex;gap:8px;margin-bottom:1.4rem;flex-wrap:wrap}
.chipbtn{padding:.3rem 1.1rem;border-radius:999px;border:2px solid var(--ink);background:#fff;cursor:pointer;font-weight:700}
.chipbtn.active{background:var(--yellow)}
.mc{border:2px solid var(--ink);border-radius:18px;padding:1.2rem 1.3rem;margin-bottom:1.1rem}
.mc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.mc .top b{border:2px solid var(--ink);border-radius:999px;padding:0 .8rem;background:#fff}
.mc.TC .top b{background:var(--pink)}.mc.RC .top b{background:var(--yellow)}
.st{cursor:pointer;border:2px solid var(--ink);padding:.15rem .9rem;border-radius:999px;font-weight:700;background:#fff}
.st.REVIEW{background:var(--pink-soft)}.st.MASTERED{background:var(--yellow)}
.zh{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:1.4rem 0 .6rem}
details summary{cursor:pointer;font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem;margin-top:1.2rem}
.flip{height:190px;perspective:900px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:1rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid var(--ink)}
.fr{background:#fff}.bk{background:var(--pink);transform:rotateY(180deg);font-size:.9rem;gap:6px}
.w{font-family:var(--display);font-size:1.7rem;font-weight:800}
.d{font-weight:800;font-size:1.15rem}
.modal{position:fixed;inset:0;background:rgba(30,27,58,.55);display:none;justify-content:center;align-items:center;z-index:1000}
.modal>div{background:#fff;padding:1.8rem;border:2px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--yellow);max-width:480px;width:90%}
.modal a{color:var(--ink);font-weight:700}
footer{border-top:2px solid var(--ink);padding:1.2rem clamp(1rem,4vw,3rem);font-size:.85rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
body{background-image:radial-gradient(#E4E0F3 1.3px,transparent 1.3px);background-size:24px 24px}
.hero{position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--pink);border:2px solid var(--ink)}
.deco{position:absolute!important;z-index:1}
.sp{right:clamp(1.5rem,9vw,7rem);bottom:1.4rem;width:64px;animation:spin 14s linear infinite}
.sq{right:clamp(1rem,4vw,3rem);bottom:5.2rem;width:110px;transform:rotate(-8deg)}
.sticker{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.1rem .9rem;font-weight:700;font-size:.9rem;transform:rotate(-3deg);margin-bottom:.9rem}
.hero h1{max-width:14em}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.zone.active>*{animation:pop .4s both}
.zone.active>*:nth-child(2){animation-delay:.06s}.zone.active>*:nth-child(3){animation-delay:.12s}.zone.active>*:nth-child(4){animation-delay:.18s}.zone.active>*:nth-child(n+5){animation-delay:.24s}
.dots{display:flex;gap:10px;justify-content:center;padding-top:4.5rem}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--pink);animation:bounce .9s infinite}
.dots i:nth-child(2){background:var(--yellow);animation-delay:.15s}.dots i:nth-child(3){background:#fff;animation-delay:.3s}
.tab:hover{transform:rotate(-2deg)}
.ans{position:relative}
.ans::after{content:"✦";position:absolute;right:18px;top:6px;font-size:1.8rem;color:var(--pink)}
.part:hover .ph b{background:linear-gradient(transparent 55%,var(--yellow) 55%)}
.dbs{margin-top:1rem;font-size:.88rem;color:var(--mute)}
.dbs .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);margin-right:6px}
.dbs.ok .dot{background:var(--yellow)}
.dbs details{margin-top:.4rem}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{background:#fff;border:none;padding:.2rem .9rem;font-weight:700;cursor:pointer;font-size:.9rem}
.seg button+button{border-left:2px solid var(--ink)}
.seg .on.r{background:var(--pink)}.seg .on.m{background:var(--yellow)}
.mc{transition:transform .2s,box-shadow .2s}.mc:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--yellow)}
.flip:nth-child(3n+2) .bk{background:var(--yellow)}.flip:nth-child(3n) .bk{background:var(--pink-soft)}
.flip:nth-child(3n+1) .fr{background:var(--yellow-soft)}.flip:nth-child(3n+2) .fr{background:var(--pink-soft)}
.flip{transition:transform .2s}.flip:hover{transform:rotate(-1.5deg) translateY(-3px)}
.rm{margin-top:.5rem;background:none;border:1.5px solid var(--ink);border-radius:999px;padding:0 .7rem;font-size:.8rem;cursor:pointer;font-weight:700}
.rm:hover{background:#fff}
@media(max-width:700px){.sq{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>GRE</b> Master Pro</div>
  <nav>
    <button class="tab active" data-tab="solver">解題</button>
    <button class="tab" data-tab="notebook">錯題本</button>
    <button class="tab" data-tab="vocab">單字書</button>
    <button class="gear" id="gear">API Key</button>
  </nav>
</header>

<div class="container">
  <section id="solver" class="pane active">
    <div class="hero">
      <svg class="deco sp" viewBox="0 0 48 48"><path d="M24 2c2 12 10 20 22 22-12 2-20 10-22 22-2-12-10-20-22-22C14 22 22 14 24 2z" fill="#fff" stroke="#1E1B3A" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <svg class="deco sq" viewBox="0 0 120 24"><path d="M2 12c10-14 18 14 28 0s18 14 28 0 18 14 28 0 18 14 28 0" fill="none" stroke="#1E1B3A" stroke-width="5" stroke-linecap="round"/></svg>
      <span class="sticker">GRE 解題助手</span>
      <h1>不會的題目，丟進來就好。</h1>
      <p>貼上文字或截圖，立刻取得中文逐空解析、整題翻譯與單字整理。</p>
    </div>
    <div class="grid">
      <div>
        <label for="model">AI 模型</label>
        <select id="model"></select><div class="hint" id="hint"></div>
        <label for="qType">題型</label>
        <select id="qType">
          <option value="TC">填空題（Text Completion / Sentence Equivalence）</option>
          <option value="RC">閱讀理解（Reading Comprehension）</option>
          <option value="Quant">數量推理（Quantitative Reasoning）</option>
        </select>
        <label for="q">題目 <span class="sub">貼上文字或上傳截圖</span></label>
        <textarea id="q" placeholder="貼上完整題目；閱讀題請連同文章一起貼"></textarea>
        <div class="drop" id="drop">點擊上傳截圖，或直接 Ctrl/⌘+V 貼上</div>
        <input type="file" id="file" accept="image/*" hidden>
        <div id="prevWrap"><img id="prev" alt="題目截圖"> <button class="btn line sm" id="rmImg">移除</button></div>
        <label for="opts">答案選項 <span class="sub">選填</span></label>
        <input type="text" id="opts" placeholder="A) ubiquitous  B) ephemeral  C) equivocal ...">
        <label for="mine">我的答案 <span class="sub">選填，AI 會指出你錯在哪</span></label>
        <input type="text" id="mine" placeholder="例如：B，因為我覺得空格是負面語氣">
        <div style="margin-top:1.3rem"><button class="btn gold" id="go">開始解析</button></div>
        <div class="dbs" id="dbstatus"></div>
      </div>
      <div id="result" class="out"><p class="empty">解題區與補充區會顯示在這裡</p></div>
    </div>
  </section>

  <section id="notebook" class="pane"><div class="card">
    <div class="card-h"><span>我的錯題本</span><button class="btn line" id="exp">備份匯出</button></div>
    <div class="filters" id="filters">
      <button class="chipbtn" data-f="REVIEW">需再複習 <span id="cntR"></span></button>
      <button class="chipbtn" data-f="MASTERED">已掌握 <span id="cntM"></span></button>
    </div>
    <div id="mlist"></div>
  </div></section>

  <section id="vocab" class="pane"><div class="card">
    <div class="card-h"><span>我的單字書</span><button class="btn line" id="cover">全部翻面</button></div>
    <input type="text" id="vs" placeholder="搜尋單字、中文意思或字根">
    <div class="vgrid" id="vgrid"></div>
  </div></section>
</div>

<div class="modal" id="modal"><div>
  <h3 id="mTitle" style="font-family:var(--display);font-size:1.4rem;margin-bottom:.6rem">API Key</h3>
  <p style="font-size:.9rem;color:var(--mute);margin-bottom:.8rem">Key 只會存在你的瀏覽器，並直接送往 Google。請勿在公用電腦使用。<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">免費申請 Key</a></p>
  <input type="password" id="keyIn" placeholder="貼上你的 API Key">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:1rem"><button class="btn line" id="keyCancel">取消</button><button class="btn gold" id="keySave">儲存</button></div>
</div></div>
<footer><span>GRE Master Pro</span><span>解析由 AI 產生，答案請自行核對</span></footer>

<script>
/* ===== Config ===== */
const CONFIG = {
  PROXY_URL: '', // set after deploying worker.js; leave empty so each user brings their own key
  PROXY_PROVIDERS: ['gemini'],
  DB_URL: './assets/GRE_Mason_Full_Database_2.json'
};
const DB_CANDIDATES = [...new Set([CONFIG.DB_URL, './GRE_Mason_Full_Database_2.json', './assets/GRE_Mason_Full_Database.json', './GRE_Mason_Full_Database.json'])];
const PROVIDERS = { gemini: { name: 'Google Gemini' } };
// Model IDs change often; check Google AI Studio for the current list. tier: top = strongest reasoning
const MODELS = [
  { id: 'gemini-3.8-flash', label: 'Gemini 3.8 Flash（快速、便宜）', provider: 'gemini', vision: true, tier: 'mid' },
  { id: 'gemini-3.1-pro-preview', label: 'Gemini 3.1 Pro（較準確）', provider: 'gemini', vision: true, tier: 'top' }
];
const SYSTEM = `你是資深 GRE 名師，學生是台灣考生。學生會貼上一道 GRE 題目（可能是文字或截圖）。請全程使用繁體中文（台灣慣用語）撰寫解析，英文原文、單字與片語保留英文。
推導規則：
- 先在 scratch_work 完整推導（可以很長，不會直接顯示）：Quant 要列出計算並驗算；填空先找線索詞與語意方向，再逐一檢查選項。
- 若題目資訊不完整（閱讀文章被截斷、截圖看不清），在 warnings 說明，不要亂猜。
- Sentence Equivalence 必須給兩個答案，並說明兩者為何同義。
輸出規則：
- answer：最終答案。多空格請寫成「空格 1：X；空格 2：Y」。
- parts：每個空格（或每個小題、每個解題步驟）一筆，包含：
  - label：「空格 1」「第 2 題」「步驟 1」之類。
  - answer：該項答案。
  - clue：線索詞與轉折詞（例如 although、however、not only…but also），保留英文原文，並說明語意方向（正向、反向、因果、對比、遞進）。Quant 則寫考點。
  - structure：句構分析（主要子句、從屬子句、修飾關係、空格的位置與所需詞性），2 到 3 句。Quant 則寫解法或公式。
  - reasoning：為什麼選這個答案，並簡短說明主要干擾選項為何不對，100 字內。Quant 則寫計算與驗算。
  - 引用原文關鍵片語時用 **粗體** 標示。
- translation：整題（題目加選項）完整的繁體中文翻譯，通順自然。
- vocab：題目與選項中值得學的單字與片語（最多 10 筆）。word 用原形；pos 寫詞性（adj.、n.、v.、adv.，片語寫「片語」）；meaning_zh 簡潔；synonyms 提供 2 到 4 個 GRE 常見同義字。
- 若使用者訊息附有「Mason 字庫參考資料」，那是補充單字時的參考：題目中出現在其中的字，meaning_zh 與 synonyms 以該資料為準（可再補充更多同義字）；不在其中的字，請自行補充。
- diagnosis：若學生提供了「我的答案」，用 2 到 3 句指出他錯在哪個思考環節；沒有則留空字串。
- 不要使用 markdown 標題、表格或條列符號。`;
const SCHEMA = {
  type: 'object',
  properties: {
    scratch_work: { type: 'string', description: '完整推導與計算草稿' },
    answer: { type: 'string' },

function loadImg(f) {

      c.width = im.width * s; c.height = im.height * s;

/* ===== 多模型呼叫 ===== */
const toGemini = s => Array.isArray(s) ? s.map(toGemini) : (s && typeof s === 'object')
  ? Object.fromEntries(Object.entries(s).filter(([k]) => k !== 'description').map(([k, v]) => [k, k === 'type' ? String(v).toUpperCase() : toGemini(v)])) : s;
const curModel = () => MODELS.find(m => m.id === $('model').value) || MODELS[0];
const keyName = p => 'GRE_KEY_' + p;

const ADAPTERS = {
  gemini: {
    url: m => `https://generativelanguage.googleapis.com/v1beta/models/${m.id}:generateContent`,
    headers: k => ({ 'x-goog-api-key': k }),
    body: (m, qType, text) => ({
      systemInstruction: { parts: [{ text: SYSTEM }] },
      contents: [{ role: 'user', parts: [...(imgData ? [{ inlineData: { mimeType: 'image/jpeg', data: imgData } }] : []), { text }] }],
      generationConfig: { maxOutputTokens: qType === 'Quant' ? 32000 : 16000, responseMimeType: 'application/json', responseSchema: toGemini(SCHEMA) }
    }),
    parse: data => {
      if (data.promptFeedback?.blockReason) throw new Error('題目被安全過濾擋下：' + data.promptFeedback.blockReason);
      const c = data.candidates?.[0];
      if (c?.finishReason === 'MAX_TOKENS') throw new Error('回答被截斷（題目太長或太複雜），請縮短後重試');
      return (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
  }
};

function normalize(a) {
  const s = v => Array.isArray(v) ? v.map(s).join(', ') : v == null ? '' : typeof v === 'string' ? v : JSON.stringify(v);
  const arr = v => Array.isArray(v) ? v : [];
  return {
    scratch_work: s(a.scratch_work), translation: s(a.translation), answer: s(a.answer), diagnosis: s(a.diagnosis), warnings: s(a.warnings),
    parts: arr(a.parts).map(p => ({ label: s(p?.label), answer: s(p?.answer), clue: s(p?.clue), structure: s(p?.structure), reasoning: s(p?.reasoning) })),
    vocab: arr(a.vocab).filter(v => v?.word).map(v => ({ word: s(v.word), pos: s(v.pos), meaning_zh: s(v.meaning_zh), synonyms: arr(v.synonyms).map(s) }))
  };
}

async function callAI(m, qType, text) {
  const A = ADAPTERS[m.provider], body = A.body(m, qType, text);
  let url, headers = { 'content-type': 'application/json' };
  if (CONFIG.PROXY_URL) { url = CONFIG.PROXY_URL; body.provider = m.provider; body.model = m.id; }
  else {
    const key = localStorage.getItem(keyName(m.provider));
    if (!key) { openModal(); throw new Error(`請先設定 ${PROVIDERS[m.provider].name} 的 API Key`); }
    url = A.url(m); Object.assign(headers, A.headers(key));
  }
  const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || (typeof data.error === 'string' ? data.error : `API 錯誤 (${r.status})`));
  let out = A.parse(data);
  if (typeof out === 'string') {
    out = out.replace(/^```(?:json)?\s*|\s*```$/g, '').trim();
    try { out = JSON.parse(out); } catch { throw new Error('模型回傳格式錯誤，請重試或換一個模型'); }
  }
  if (!out || typeof out !== 'object') throw new Error('模型沒有回傳內容，請重試');
  out = normalize(out); out.qType = qType;
  if (!out.answer) throw new Error('模型沒有給出答案，請重試或換一個更強的模型');
  return out;
}

/* ===== Mason reference lookup (the deck is reference data for the AI, not shown as flashcards) ===== */
const variants = t => {
  const v = new Set([t]);
  for (const [re, to] of [[/ies$/, 'y'], [/ied$/, 'y'], [/(es|ed)$/, ''], [/[sd]$/, ''], [/ing$/, ''], [/ing$/, 'e'], [/ly$/, ''], [/ally$/, 'al'], [/ness$/, '']]) if (re.test(t)) v.add(t.replace(re, to));
  return [...v];
};
const findMason = w => { for (const x of variants(String(w).toLowerCase().trim())) if (dbMap.has(x)) return dbMap.get(x); return null; };
function masonRefs(text) {
  const low = text.toLowerCase(), found = new Map();
  for (const t of low.match(/[a-z][a-z'-]{3,}/g) || []) { const m = findMason(t); if (m) found.set(m.word.toLowerCase(), m); }
  for (const p of phrases) if (low.includes(p.word.toLowerCase())) found.set(p.word.toLowerCase(), p);
  return [...found.values()].slice(0, 60);
}

/* ===== Mason reference deck (fed to the AI as reference; never shown as cards) ===== */
let phrases = [];
function normDb(raw) {
  const list = Array.isArray(raw) ? raw : Array.isArray(raw?.words) ? raw.words
    : raw && typeof raw === 'object' ? Object.entries(raw).map(([k, v]) => typeof v === 'object' ? { word: k, ...v } : { word: k, def: String(v) }) : [];
  const pick = (w, re) => { for (const k of Object.keys(w)) if (re.test(k) && w[k] != null && w[k] !== '') return w[k]; return ''; };
  const cjk = w => { for (const v of Object.values(w)) if (typeof v === 'string' && /[\u4e00-\u9fff]/.test(v)) return v; return ''; };
  return list.filter(w => w && typeof w === 'object').map(w => {
    const syn = w.synonyms ?? pick(w, /syn|同義/i);
    return {
      word: String(w.word ?? pick(w, /^(word|vocab|term|headword|單字|英文)/i)).trim(),
      phonetic: String(pick(w, /pron|phon|ipa|音標/i)),
      def: String(pick(w, /^(def|mean|zh|chi|中文|釋義)/i) || cjk(w)),
      root: String(pick(w, /root|etym|字根|字源/i)),
      synonyms: Array.isArray(syn) ? syn.map(String) : typeof syn === 'string' ? syn.split(/[,;、，；]\s*/).filter(Boolean) : []
    };
  }).filter(w => w.word);
}
function setDb(db, note = '') {
  mason = db; dbMap = new Map(mason.map(w => [w.word.toLowerCase(), w])); phrases = mason.filter(w => /\s/.test(w.word));
  $('dbstatus').className = 'dbs ok';
  $('dbstatus').innerHTML = `<span class="dot"></span>Mason 字庫已載入（${db.length} 字），AI 補充單字時會參考它。${note}`;
}
async function loadDb() {
  const tried = [];
  for (const u of DB_CANDIDATES) {
    try {
      const r = await fetch(u, { cache: 'no-cache' });
      if (!r.ok) { tried.push(`${u}：HTTP ${r.status}`); continue; }
      const db = normDb(await r.json());
      if (!db.length) { tried.push(`${u}：讀到了，但找不到含 "word" 欄位的資料`); continue; }
      return { db, tried };
    } catch (e) { tried.push(`${u}：${e.message || '被瀏覽器擋下'}`); }
  }
  return { db: null, tried };
}
function showDbWarn(tried) {
  $('dbstatus').className = 'dbs';
  $('dbstatus').innerHTML = `<span class="dot"></span>Mason 字庫未載入。AI 仍可正常解題，只是單字補充不會參考字庫。
    <div style="margin-top:.4rem"><button class="btn line sm" onclick="$('dbfile').click()">手動載入 JSON</button><input type="file" id="dbfile" accept=".json,application/json" hidden onchange="importDb(this.files[0])"></div>
    <details><summary>為什麼？</summary>檔案需放在 repo 的 <code>assets/GRE_Mason_Full_Database_2.json</code>（GitHub 區分大小寫）。${location.protocol === 'file:' ? '你目前是直接從硬碟開啟，瀏覽器會擋下讀檔；請改用 GitHub Pages 或 localhost。' : ''}
    ${tried.map(t => `<div>${esc(t)}</div>`).join('')}</details>`;
}
async function importDb(f) {
  if (!f) return;
  try {
    const raw = JSON.parse(await f.text()), db = normDb(raw);
    if (!db.length) throw new Error('找不到含 "word" 欄位的資料');
    setDb(db, '（手動載入）');
    try { localStorage.setItem('GRE_MASON_IMPORT', JSON.stringify(raw)); } catch { /* too big to cache */ }
  } catch (e) { alert('無法讀取這個檔案：' + e.message); }
}

/* ===== Init ===== */
(async () => {
  $('dbstatus').innerHTML = '<span class="dot"></span>Mason 字庫載入中…';
  const { db, tried } = await loadDb();
  if (db) setDb(db);
  else {
    const saved = load('GRE_MASON_IMPORT', null), sdb = saved ? normDb(saved) : [];
    if (sdb.length) setDb(sdb, '（使用你之前手動載入的檔案）'); else showDbWarn(tried);
  }
  renderVocab(); renderMistakes();
})();
</script>
</body>
